name: Update Golang version

pipelineid: golang/version

labels:
  monitor: active
  ecosystem: golang

sources:
  go:
    name: Get latest Golang version
    kind: golang

conditions:
  docker:
    name: Check Docker image tag
    kind: dockerimage
    sourceid: go
    spec:
      image: docker.io/library/golang

targets:
  gomod:
    name: 'deps(go): update Go version to {{ source "go" }}'
    sourceid: go
    kind: golang/gomod
    scmid: default
    spec:
      file: go.mod

  pre-commit-yaml:
    name: 'deps(go): update pre-commit Go version to {{ source "go" }}'
    sourceid: go
    kind: yaml
    scmid: default
    spec:
      file: .pre-commit-config.yaml
      keys:
        - $.repos[*].hooks[*].language_version

actions:
  default:
    title: 'deps(go): update Go to {{ source "go" }} version'
    kind: github/pullrequest
    scmid: default
    spec:
      merge:
        strategy: manual
      mergemethod: squash
      description: |
        Automatic Golang version {{ source "go" }} update.
        This PR has been created by the automation used to automatically update the Golang version in the neuvector-runtime-enforcer-policy-converter project
        REMEMBER IF YOU WANT TO MERGE IN A SINGLE COMMIT CHANGES AND VERSION BUMP, YOU MUST SQUASH THE COMMIT BEFORE MERGING THIS PR!
      draft: false
      labels:
        - "chore"
        - "dependencies"

scms:
  default:
    kind: github
    spec:
      user: "{{ .scm.author }}"
      email: "{{ .scm.email }}"
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"
      commitusingapi: true
      commitmessage:
        type: "chore"
        scope: deps
        hidecredit: true
        footers: "Signed-off-by: NeuVectorRuntimeEnforcerPolicyConverter bot <neuvector-runtime-enforcer-policy-converter-bot@users.noreply.github.com>"
