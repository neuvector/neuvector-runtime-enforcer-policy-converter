name: Build and Upload converter
on:
  workflow_call:
    inputs:
      version:
        type: string
  push:
    branches:
      - "main"
jobs:
  upload-converter:
    name: Upload converter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
      - name: Build converter for all platforms
        run: make converter-cross
      - name: Upload converter artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: converter
          path: bin/nvrules2re/
          if-no-files-found: error
          retention-days: 7
